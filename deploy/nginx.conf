# Replace wholesale.example.com and certificate paths with the verified domain.
limit_req_zone $binary_remote_addr zone=mah_enquiries:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=mah_admin:10m rate=30r/m;
server {
    listen 80;
    server_name wholesale.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name wholesale.example.com;
    ssl_certificate /etc/letsencrypt/live/wholesale.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wholesale.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 9m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    location /static/ {
        alias /srv/manarat/app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /media/ {
        alias /srv/manarat/uploads/;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /request-quote/ {
        limit_req zone=mah_enquiries burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location /admin {
        limit_req zone=mah_admin burst=20 nodelay;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://127.0.0.1:8000;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
